apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
  - name: redisHost
    value: {{ .Values.dapr.redisHost | quote }}
  - name: redisPassword
    secretKeyRef:
      name: {{ .Values.dapr.existingRedisSecret | default (printf "%s-dapr-secrets" (include "daprenv.fullname" .)) }}
      key: redis-password
  - name: redisDB
    value: {{ .Values.dapr.redisDB | default 0 | quote }}
  - name: keyPrefix
    value: "namespace"
  - name: actorStateStore
    value: "true"
scopes:
  - orderservice
  - kitchenservice
  - financeservice
  - orderserviceactors
  - frontendselfservicepos
  - frontendkitchenmonitor
  - frontendcustomerorderstatus

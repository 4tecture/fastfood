name: fastfood

services:
  
  financeservice:
    container_name: financeservice
    image: financeservice
    build:
      context: .
      dockerfile: services/finance/FinanceService/Dockerfile
    ports:
      - "127.0.0.1:8901:8080"
    environment:
      - DAPR_HTTP_PORT=3500
      - DAPR_GRPC_PORT=50001  
      - Database__ApplySchemaOnStartup=true
      # The fallback is intentionally workstation/demo-only so that ordinary
      # `docker compose up`, `ps`, and `down` remain usable. start-compose.*
      # overrides it with a randomly generated value from ignored src/.env.
      - ConnectionStrings__FinanceDatabase=Server=sqldb-fastfood;Database=Finance;User Id=sa;Password=${MSSQL_SA_PASSWORD:-FastFood-LocalDemo_2026!};Encrypt=True;TrustServerCertificate=True
      # - Observability__UseTracingExporter=otlp
      # - Observability__UseMetricsExporter=otlp
      # - Observability__UseLogExporter=OtlpAndAnsiConsole
      # - Observability__SamplerType=AlwaysOnSampler
      # - Observability__OtlpExporter__Endpoint=http://otel-collector:4317
      - Observability__UseTracingExporter=none
      - Observability__UseMetricsExporter=none
      - Observability__UseLogExporter=AnsiConsole
      - Observability__SamplerType=AlwaysOffSampler
    networks:
      - fastfoodnet

  financeservice-dapr:
    container_name: financeservice-dapr
    image: "daprio/daprd:1.18.2"
    command: [ "./daprd",
               "--app-id", "financeservice",
               "--app-port", "8080",
               "--placement-host-address", "placement:50005",
               "--resources-path", "/resources",
               "--config", "/config/config.yaml",
               "--sentry-address", "sentry:50001",
               "--log-level", "info",
               "--control-plane-trust-domain", "cluster.local",
               "--enable-mtls"]
    volumes:
      - "../infrastructure-dev/dapr/resources/:/resources"
      - "../infrastructure-dev/dapr/config/:/config"
    env_file:
      - path: ../infrastructure-dev/dapr/certs/generated/mtls.env
        required: false
    environment:
      - OTEL_PROPAGATORS=tracecontext,b3
    depends_on:
      financeservice:
        condition: service_started
      redis:
        condition: service_started
      placement:
        condition: service_started
      scheduler:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    network_mode: "service:financeservice"
  
  kitchenservice:
    container_name: kitchenservice
    image: kitchenservice
    build:
      context: .
      dockerfile: services/kitchen/KitchenService/Dockerfile
    ports:
      - "127.0.0.1:8701:8080"
    environment:
      - DAPR_HTTP_PORT=3500
      - DAPR_GRPC_PORT=50001
      # - Observability__UseTracingExporter=otlp
      # - Observability__UseMetricsExporter=otlp
      # - Observability__UseLogExporter=OtlpAndAnsiConsole
      # - Observability__SamplerType=AlwaysOnSampler
      # - Observability__OtlpExporter__Endpoint=http://otel-collector:4317
      - Observability__UseTracingExporter=none
      - Observability__UseMetricsExporter=none
      - Observability__UseLogExporter=AnsiConsole
      - Observability__SamplerType=AlwaysOffSampler
    networks:
      - fastfoodnet

  kitchenservice-dapr:
    container_name: kitchenservice-dapr
    image: "daprio/daprd:1.18.2"
    command: ["./daprd",
              "--app-id", "kitchenservice",
              "--app-port", "8080",
              "--placement-host-address", "placement:50005",
              "--resources-path", "/resources",
              "--config", "/config/config.yaml",
              "--sentry-address", "sentry:50001",
              "--log-level", "info",
              "--control-plane-trust-domain", "cluster.local",
              "--enable-mtls"]
    volumes:
      - "../infrastructure-dev/dapr/resources/:/resources"
      - "../infrastructure-dev/dapr/config/:/config"
    env_file:
      - path: ../infrastructure-dev/dapr/certs/generated/mtls.env
        required: false
    environment:
      - OTEL_PROPAGATORS=tracecontext,b3
    depends_on:
      kitchenservice:
        condition: service_started
      redis:
        condition: service_started
      placement:
        condition: service_started
      scheduler:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    network_mode: "service:kitchenservice"

  orderservice:
    container_name: orderservice
    image: orderservice
    build:
      context: .
      dockerfile: services/order/OrderService/Dockerfile
    ports:
      - "127.0.0.1:8601:8080"
    environment:
      - DAPR_HTTP_PORT=3500
      - DAPR_GRPC_PORT=50001
      # Explicitly enable only the harmless local sample used by the secret-store lab.
      # Kubernetes/Helm keeps the endpoint disabled by default.
      - Demos__SecretEndpoint__Enabled=true
      - Demos__SecretEndpoint__AllowedKeys__0=demo.sample
      # - Observability__UseTracingExporter=otlp
      # - Observability__UseMetricsExporter=otlp
      # - Observability__UseLogExporter=OtlpAndAnsiConsole
      # - Observability__SamplerType=AlwaysOnSampler
      # - Observability__OtlpExporter__Endpoint=http://otel-collector:4317
      - Observability__UseTracingExporter=none
      - Observability__UseMetricsExporter=none
      - Observability__UseLogExporter=AnsiConsole
      - Observability__SamplerType=AlwaysOffSampler
    networks:
      - fastfoodnet

  orderservice-dapr:
    container_name: orderservice-dapr
    image: "daprio/daprd:1.18.2"
    command: ["./daprd",
              "--app-id", "orderservice",
              "--app-port", "8080",
              "--placement-host-address", "placement:50005",
              "--resources-path", "/resources",
              "--config", "/config/config.yaml",
              "--sentry-address", "sentry:50001",
              "--log-level", "info",
              "--control-plane-trust-domain", "cluster.local",
              "--enable-mtls"]
    volumes:
      - "../infrastructure-dev/dapr/resources/:/resources"
      - "../infrastructure-dev/dapr/config/:/config"
    env_file:
      - path: ../infrastructure-dev/dapr/certs/generated/mtls.env
        required: false
    environment:
      - OTEL_PROPAGATORS=tracecontext,b3
    depends_on:
      orderservice:
        condition: service_started
      redis:
        condition: service_started
      placement:
        condition: service_started
      scheduler:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    network_mode: "service:orderservice"

  orderserviceactors:
    container_name: orderserviceactors
    image: orderserviceactors
    build:
      context: .
      dockerfile: services/order/OrderService.Actors/Dockerfile
    ports:
      - "127.0.0.1:8651:8080"
    environment:
      - DAPR_HTTP_PORT=3500
      - DAPR_GRPC_PORT=50001
      # - Observability__UseTracingExporter=otlp
      # - Observability__UseMetricsExporter=otlp
      # - Observability__UseLogExporter=OtlpAndAnsiConsole
      # - Observability__SamplerType=AlwaysOnSampler
      # - Observability__OtlpExporter__Endpoint=http://otel-collector:4317
      - Observability__UseTracingExporter=none
      - Observability__UseMetricsExporter=none
      - Observability__UseLogExporter=AnsiConsole
      - Observability__SamplerType=AlwaysOffSampler
    networks:
      - fastfoodnet

  orderserviceactors-dapr:
    container_name: orderserviceactors-dapr
    image: "daprio/daprd:1.18.2"
    command: ["./daprd",
              "--app-id", "orderserviceactors",
              "--app-port", "8080",
              "--placement-host-address", "placement:50005",
              "--resources-path", "/resources",
              "--config", "/config/config.yaml",
              "--sentry-address", "sentry:50001",
              "--log-level", "info",
              "--control-plane-trust-domain", "cluster.local",
              "--enable-mtls"]
    volumes:
      - "../infrastructure-dev/dapr/resources/:/resources"
      - "../infrastructure-dev/dapr/config/:/config"
    env_file:
      - path: ../infrastructure-dev/dapr/certs/generated/mtls.env
        required: false
    environment:
      - OTEL_PROPAGATORS=tracecontext,b3
    depends_on:
      orderserviceactors:
        condition: service_started
      redis:
        condition: service_started
      placement:
        condition: service_started
      scheduler:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    network_mode: "service:orderserviceactors"

  frontendselfservicepos:
    container_name: frontendselfservicepos
    image: frontendselfservicepos
    build:
      context: .
      dockerfile: services/frontendselfservicepos/FrontendSelfServicePos/Dockerfile
    ports:
      - "127.0.0.1:8801:8080"
    environment:
      - DAPR_HTTP_PORT=3500
      - DAPR_GRPC_PORT=50001
      # - Observability__UseTracingExporter=otlp
      # - Observability__UseMetricsExporter=otlp
      # - Observability__UseLogExporter=OtlpAndAnsiConsole
      # - Observability__SamplerType=AlwaysOnSampler
      # - Observability__OtlpExporter__Endpoint=http://otel-collector:4317
      - Observability__UseTracingExporter=none
      - Observability__UseMetricsExporter=none
      - Observability__UseLogExporter=AnsiConsole
      - Observability__SamplerType=AlwaysOffSampler
    networks:
      - fastfoodnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontendselfservicepos.rule=Host(`pos.localtest.me`)"
      - "traefik.http.routers.frontendselfservicepos.entrypoints=websecure"
      - "traefik.http.services.frontendselfservicepos.loadbalancer.server.port=8080"

  frontendselfservicepos-dapr:
    container_name: frontendselfservicepos-dapr
    image: "daprio/daprd:1.18.2"
    command: ["./daprd",
              "--app-id", "frontendselfservicepos",
              "--app-port", "8080",
              "--placement-host-address", "placement:50005",
              "--resources-path", "/resources",
              "--config", "/config/config.yaml",
              "--sentry-address", "sentry:50001",
              "--log-level", "info",
              "--control-plane-trust-domain", "cluster.local",
              "--enable-mtls"]
    volumes:
      - "../infrastructure-dev/dapr/resources/:/resources"
      - "../infrastructure-dev/dapr/config/:/config"
    env_file:
      - path: ../infrastructure-dev/dapr/certs/generated/mtls.env
        required: false
    environment:
      - OTEL_PROPAGATORS=tracecontext,b3
    depends_on:
      kitchenservice:
        condition: service_started
      redis:
        condition: service_started
      placement:
        condition: service_started
      scheduler:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    network_mode: "service:frontendselfservicepos"
    
  frontendkitchenmonitor:
    container_name: frontendkitchenmonitor
    image: frontendkitchenmonitor
    build:
      context: .
      dockerfile: services/frontendkitchenmonitor/FrontendKitchenMonitor/Dockerfile
    ports:
      - "127.0.0.1:8802:8080"
    environment:
      - DAPR_HTTP_PORT=3500
      - DAPR_GRPC_PORT=50001
      # - Observability__UseTracingExporter=otlp
      # - Observability__UseMetricsExporter=otlp
      # - Observability__UseLogExporter=OtlpAndAnsiConsole
      # - Observability__SamplerType=AlwaysOnSampler
      # - Observability__OtlpExporter__Endpoint=http://otel-collector:4317
      - Observability__UseTracingExporter=none
      - Observability__UseMetricsExporter=none
      - Observability__UseLogExporter=AnsiConsole
      - Observability__SamplerType=AlwaysOffSampler
    networks:
      - fastfoodnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontendkitchenmonitor.rule=Host(`kitchen.localtest.me`)"
      - "traefik.http.routers.frontendkitchenmonitor.entrypoints=websecure"
      - "traefik.http.services.frontendkitchenmonitor.loadbalancer.server.port=8080"  
  
  frontendkitchenmonitor-dapr:
    container_name: frontendkitchenmonitor-dapr
    image: "daprio/daprd:1.18.2"
    command: [ "./daprd",
               "--app-id", "frontendkitchenmonitor",
               "--app-port", "8080",
               "--placement-host-address", "placement:50005",
               "--resources-path", "/resources",
               "--config", "/config/config.yaml",
               "--sentry-address", "sentry:50001",
               "--log-level", "info",
               "--control-plane-trust-domain", "cluster.local",
               "--enable-mtls" ]
    volumes:
      - "../infrastructure-dev/dapr/resources/:/resources"
      - "../infrastructure-dev/dapr/config/:/config"
    env_file:
      - path: ../infrastructure-dev/dapr/certs/generated/mtls.env
        required: false
    environment:
      - OTEL_PROPAGATORS=tracecontext,b3
    depends_on:
      kitchenservice:
        condition: service_started
      redis:
        condition: service_started
      placement:
        condition: service_started
      scheduler:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    network_mode: "service:frontendkitchenmonitor"

  frontendcustomerorderstatus:
    container_name: frontendcustomerorderstatus
    image: frontendcustomerorderstatus
    build:
      context: .
      dockerfile: services/frontendcustomerorderstatus/FrontendCustomerOrderStatus/Dockerfile
    ports:
      - "127.0.0.1:8803:8080"
    environment:
      - DAPR_HTTP_PORT=3500
      - DAPR_GRPC_PORT=50001
      # - Observability__UseTracingExporter=otlp
      # - Observability__UseMetricsExporter=otlp
      # - Observability__UseLogExporter=OtlpAndAnsiConsole
      # - Observability__SamplerType=AlwaysOnSampler
      # - Observability__OtlpExporter__Endpoint=http://otel-collector:4317
      - Observability__UseTracingExporter=none
      - Observability__UseMetricsExporter=none
      - Observability__UseLogExporter=AnsiConsole
      - Observability__SamplerType=AlwaysOffSampler
    networks:
      - fastfoodnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontendcustomerorderstatus.rule=Host(`orderstatus.localtest.me`)"
      - "traefik.http.routers.frontendcustomerorderstatus.entrypoints=websecure"
      - "traefik.http.services.frontendcustomerorderstatus.loadbalancer.server.port=8080"
  
  frontendcustomerorderstatus-dapr:
    container_name: frontendcustomerorderstatus-dapr
    image: "daprio/daprd:1.18.2"
    command: [ "./daprd",
               "--app-id", "frontendcustomerorderstatus",
               "--app-port", "8080",
               "--placement-host-address", "placement:50005",
               "--resources-path", "/resources",
               "--config", "/config/config.yaml",
               "--sentry-address", "sentry:50001",
               "--log-level", "info",
               "--control-plane-trust-domain", "cluster.local",
               "--enable-mtls" ]
    volumes:
      - "../infrastructure-dev/dapr/resources/:/resources"
      - "../infrastructure-dev/dapr/config/:/config"
    env_file:
      - path: ../infrastructure-dev/dapr/certs/generated/mtls.env
        required: false
    environment:
      - OTEL_PROPAGATORS=tracecontext,b3
    depends_on:
      kitchenservice:
        condition: service_started
      redis:
        condition: service_started
      placement:
        condition: service_started
      scheduler:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    network_mode: "service:frontendcustomerorderstatus"

  redis:
    container_name: redis
    image: "redis:8.10.0"
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - fastfoodnet

  placement:
    container_name: placement
    image: "daprio/dapr:1.18.2"
    command: ["./placement",
              "--sentry-address", "sentry:50001",
              "--tls-enabled",
              "--trust-domain", "cluster.local"]
    ports:
      - "127.0.0.1:50005:50005"
    volumes:
      - "../infrastructure-dev/dapr/certs/generated/:/var/run/secrets/dapr.io/tls"
    networks:
      - fastfoodnet
      
  scheduler:
    image: "daprio/dapr:1.18.2"
    command: [ "./scheduler", 
               "--port", "50007"]
    ports:
      - "127.0.0.1:50007:50007"
    volumes:
      - "../infrastructure-dev/dapr/certs/generated/:/var/run/secrets/dapr.io/tls"
      - "../infrastructure-dev/dapr/data/scheduler:/data"
    networks:
      - fastfoodnet
        
  sentry:
    image: "daprio/sentry:1.18.2"
    container_name: sentry
    command: ["./sentry",
              "--issuer-credentials", "/certs",
              "--trust-domain", "cluster.local",
              "--config", "/config/config.yaml",
              "--log-level", "info",
    ]
    volumes:
      - "../infrastructure-dev/dapr/certs/generated/:/certs"
      - "../infrastructure-dev/dapr/config/:/config"
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      - fastfoodnet

  rabbitmq:
    container_name: rabbitmq
    image: "rabbitmq:4.3.4-management"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    networks:
      - fastfoodnet
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 5s
      timeout: 5s
      retries: 5
      
  dapr-dashboard:
    container_name: dapr-dashboard
    image: "daprio/dashboard:0.15.0"
    command: [ "-docker-compose=true",
               "-components-path=/home/nonroot/components",
               "-config-path=/home/nonroot/configuration",
               "-docker-compose-path=/home/nonroot/docker-compose.yml" ]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - "../infrastructure-dev/dapr/resources/:/home/nonroot/components"
      - "../infrastructure-dev/dapr/config/:/home/nonroot/configuration"
      - "./docker-compose.yml:/home/nonroot/docker-compose.yml"
      - "../infrastructure-dev/dapr/certs/generated:/app/dapr/certs"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.daprdashboard.rule=Host(`daprdashboard.localtest.me`)"
      - "traefik.http.routers.daprdashboard.entrypoints=websecure"
      - "traefik.http.services.daprdashboard.loadbalancer.server.port=8080"
    networks:
      - fastfoodnet

  sqldb:
    profiles: ["database"]
    container_name: sqldb-fastfood
    hostname: sqldb-fastfood
    image: "mcr.microsoft.com/mssql/server:2025-CU7-ubuntu-24.04"
#    image: "mcr.microsoft.com/azure-sql-edge:<approved-version>"
    ports:
      - '127.0.0.1:1433:1433'
#    user: '0:0'
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-FastFood-LocalDemo_2026!}
#    volumes:
#      - '../infrastructure-dev/mssql/data:/var/opt/mssql/data'
#      - '../infrastructure-dev/mssql/backup:/var/opt/mssql/backup'
    networks:
      fastfoodnet:
        aliases:
          - sqldb-fastfood
    

  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.4.2@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    environment:
      CONTAINERS: 1
      EVENTS: 1
      INFO: 1
      NETWORKS: 1
      PING: 1
      VERSION: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - fastfoodnet

  proxy:
    container_name: proxy
    image: traefik:v3.7.10
    command:
      - "--api.insecure=true" # Traefik dashboard (only for dev)
      - "--log.level=INFO"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://docker-socket-proxy:2375"
      - "--providers.docker.network=fastfoodnet"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/config/traefik.yml"
      - "--entrypoints.web.address=:80"
      # - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      # - "--entryPoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.asDefault=true" 
      - "--entrypoints.websecure.http.tls=true"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--accesslog.format=json"
    ports:
      - "127.0.0.1:80:80"   # HTTP
      - "127.0.0.1:443:443" # HTTPS
      - "127.0.0.1:8081:8080" # Traefik Dashboard
    volumes:
      - "../infrastructure-dev/proxy/certs:/certs" # Mounting the directory containing the self-signed certs
      - "../infrastructure-dev/proxy/traefikconfig:/config"
    networks:
      fastfoodnet:
        aliases: 
          - pos.localtest.me
          - kitchen.localtest.me
          - orderstatus.localtest.me
          - daprdashboard.localtest.me
          - grafana.localtest.me
          - jaeger.localtest.me

  # The observability stack is opt-in for the Copilot HOL. Start it with
  # `docker compose --profile observability up --build` when needed.
  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.158.0
    container_name: otel-collector
    deploy:
      resources:
        limits:
          memory: 125M
    restart: unless-stopped
    command:
      - "--config=/etc/otel-collector-config.yml"
      #- "--feature-gates=-component.UseLocalHostAsDefaultHost"
    volumes:
      - ../infrastructure-dev/otel-collector/otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "127.0.0.1:4317:4317" # OTLP over gRPC receiver
      - "127.0.0.1:4318:4318" # OTLP over HTTP receiver
      - "127.0.0.1:9464:9464" # Prometheus exporter
      - "127.0.0.1:8888:8888" # metrics endpoint
    depends_on:
      - jaeger
      - prometheus
      - loki
    networks:
      - fastfoodnet

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.1.3
    container_name: grafana
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - ../infrastructure-dev/grafana/grafana.ini:/etc/grafana/grafana.ini
      - ../infrastructure-dev/grafana/provisioning/:/etc/grafana/provisioning/
    ports:
      - "127.0.0.1:3000:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.localtest.me`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    networks:
      - fastfoodnet

  jaeger:
    profiles: ["observability"]
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    container_name: jaeger
    command:
      - "--set=extensions.jaeger_storage.backends.some_storage.memory.max_traces=10000"
      - "--set=extensions.jaeger_storage.metric_backends.some_metrics_storage.prometheus.endpoint=http://prometheus:9090"
      - "--set=extensions.jaeger_storage.metric_backends.some_metrics_storage.prometheus.normalize_calls=true"
      - "--set=extensions.jaeger_storage.metric_backends.some_metrics_storage.prometheus.normalize_duration=true"
      - "--set=extensions.jaeger_query.storage.metrics=some_metrics_storage"
      - "--set=extensions.jaeger_query.base_path=/jaeger/ui"
    deploy:
      resources:
        limits:
          memory: 300M
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI
    expose:
      - "4317"                  # OTLP gRPC inside the Compose network
    environment:
      - JAEGER_LISTEN_HOST=0.0.0.0
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jaeger.rule=Host(`jaeger.localtest.me`)"
      - "traefik.http.routers.jaeger.entrypoints=websecure"
      - "traefik.http.services.jaeger.loadbalancer.server.port=16686"
    networks:
      - fastfoodnet

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.7.6
    container_name: loki
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
    - ../infrastructure-dev/loki/loki-config.yaml:/etc/loki/loki-config.yaml
    networks:
      - fastfoodnet

  prometheus:
    profiles: ["observability"]
    image: quay.io/prometheus/prometheus:v3.13.2
    container_name: prometheus
    command:
      - --web.console.templates=/etc/prometheus/consoles
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --storage.tsdb.retention.time=1h
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --enable-feature=exemplar-storage
      - --enable-feature=native-histograms
      - --web.enable-otlp-receiver
    volumes:
      - ../infrastructure-dev/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml
    deploy:
      resources:
        limits:
          memory: 300M
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - fastfoodnet

networks:
  fastfoodnet:
    name: fastfoodnet

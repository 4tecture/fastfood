{{- if and .Values.migration.enabled .Values.migration.waitForJob.enabled (not .Values.database.useInMemoryDatabase) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "financeservice.fullname" . }}-migration-wait
  labels:
    {{- include "financeservice.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "financeservice.fullname" . }}-migration-wait
  labels:
    {{- include "financeservice.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "financeservice.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "financeservice.fullname" . }}-migration-wait
{{- end }}

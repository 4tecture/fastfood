{{- if and .Values.migration.enabled (not .Values.database.useInMemoryDatabase) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: '{{ include "financeservice.fullname" . }}-dbdeployment-{{ .Release.Revision }}'
  labels:
    {{- include "financeservice.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "financeservice.labels" . | nindent 8 }}
        {{- if and .Values.deployWorkloadIdentity.enabled (eq .Values.deployWorkloadIdentity.provider "Azure") }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ include "financeservice.deployServiceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}-dbdeployment
          image: "{{ .Values.image.dbdeployclirepository }}{{ if .Values.image.dbDeployDigest }}@{{ .Values.image.dbDeployDigest }}{{ else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          command: ["dotnet"]
          args: ["FinanceService.Db.Cli.dll", "deploy", "--connectionstring", "$(CONNECTIONSTRING)", "--dacpacfile", "FinanceService.Db.dacpac"]
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          env:
            - name: CONNECTIONSTRING
              {{- if .Values.database.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: ConnectionStrings__FinanceDatabase
              {{- else }}
              value: {{ required "database.connectionString or database.existingSecret is required when migrations are enabled" .Values.database.connectionString | quote }}
              {{- end }}
      restartPolicy: Never
{{- end }}

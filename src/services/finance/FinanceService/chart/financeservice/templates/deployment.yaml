apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "financeservice.fullname" . }}
  labels:
    {{- include "financeservice.labels" . | nindent 4 }}
spec:
  revisionHistoryLimit: 5
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "financeservice.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.podAnnotations (and .Values.workloadIdentity.enabled (eq .Values.workloadIdentity.provider "Azure") .Values.migration.enabled .Values.migration.waitForJob.enabled (not .Values.database.useInMemoryDatabase)) }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if and $.Values.workloadIdentity.enabled (eq $.Values.workloadIdentity.provider "Azure") $.Values.migration.enabled $.Values.migration.waitForJob.enabled (not $.Values.database.useInMemoryDatabase) }}
        # The migration waiter calls Kubernetes, not Azure. Keep the Azure
        # federation token out of that init container.
        azure.workload.identity/skip-containers: "finance-migration-wait"
        {{- end }}
      {{- end }}
      labels:
        {{- include "financeservice.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if and .Values.workloadIdentity.enabled (eq .Values.workloadIdentity.provider "Azure") }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "financeservice.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if and .Values.migration.enabled .Values.migration.waitForJob.enabled (not .Values.database.useInMemoryDatabase) }}
      initContainers:
        - name: finance-migration-wait
          image: "{{ .Values.migration.waitForJob.image.repository }}@{{ required "migration.waitForJob.image.digest is required" .Values.migration.waitForJob.image.digest }}"
          imagePullPolicy: {{ .Values.migration.waitForJob.image.pullPolicy }}
          args:
            - job
            - '{{ include "financeservice.fullname" . }}-dbdeployment-{{ .Release.Revision }}'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            {{- toYaml .Values.migration.waitForJob.resources | nindent 12 }}
          volumeMounts:
            - name: migration-wait-kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- range $key, $value := .Values.envvariables }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}

            {{- if not .Values.database.useInMemoryDatabase }}
            - name: ConnectionStrings__FinanceDatabase
              {{- if .Values.database.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: ConnectionStrings__FinanceDatabase
              {{- else }}
              value: {{ required "database.connectionString or database.existingSecret is required when the in-memory database is disabled" .Values.database.connectionString | quote }}
              {{- end }}
            {{- end }}
            
            - name: FeatureManagement__UseInMemoryDatabase
              value: {{ .Values.database.useInMemoryDatabase | quote }}

            {{- range $key, $value := .Values.observability }}
            {{- if eq $key "serviceName" }}
            - name: Observability__ServiceName
              value: {{ $value | quote }}
            {{- else if eq $key "otlpExporter" }}
            {{- range $subkey, $subvalue := $value }}
            - name: Observability__OtlpExporter__{{ $subkey | camelcase }}
              value: {{ $subvalue | quote }}
            {{- end }}
            {{- else if eq $key "logLevels" }}
            {{- if $value.default }}
            - name: Observability__LogLevels__Default
              value: {{ $value.default | quote }}
            {{- end }}
            {{- if $value.filters }}
            {{- range $subkey, $subvalue := $value.filters }}
            - name: Observability__LogLevels__Filters__{{ $subkey }}
              value: {{ $subvalue | quote }}
            {{- end }}
            {{- end }}
            {{- else if eq $key "aspNetCoreInstrumentation" }}
            {{- range $subkey, $subvalue := $value }}
            - name: Observability__AspNetCoreInstrumentation__{{ $subkey | camelcase }}
              value: {{ $subvalue | quote }}
            {{- end }}
            {{- else if eq $key "sqlClientInstrumentation" }}
                        {{- range $subkey, $subvalue := $value }}
            - name: Observability__SqlClientInstrumentation__{{ $subkey | camelcase }}
              value: {{ $subvalue | quote }}
            {{- end }}
            {{- else if eq $key "stackExchangeRedisInstrumentation" }}
                                    {{- range $subkey, $subvalue := $value }}
            - name: Observability__StackExchangeRedisInstrumentation__{{ $subkey | camelcase }}
              value: {{ $subvalue | quote }}
            {{- end }}
            {{- else if eq $key "entityFrameworkInstrumentation" }}
                                                {{- range $subkey, $subvalue := $value }}
            - name: Observability__EntityFrameworkInstrumentation__{{ $subkey | camelcase }}
              value: {{ $subvalue | quote }}
            {{- end }}
            {{- else }}
            - name: Observability__{{ $key | camelcase }}
              value: {{ $value | quote }}
              {{- end }}
            {{- end }}
      {{- if or .Values.volumes (and .Values.migration.enabled .Values.migration.waitForJob.enabled (not .Values.database.useInMemoryDatabase)) }}
      volumes:
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if and $.Values.migration.enabled $.Values.migration.waitForJob.enabled (not $.Values.database.useInMemoryDatabase) }}
        - name: migration-wait-kube-api-access
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  expirationSeconds: {{ $.Values.migration.waitForJob.tokenExpirationSeconds }}
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
                      path: namespace
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

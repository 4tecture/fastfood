{{- if .Values.daprKubernetesSecretStore.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "orderservice.fullname" . }}-secret-reader
  labels:
    {{- include "orderservice.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- toYaml .Values.daprKubernetesSecretStore.allowedSecretNames | nindent 6 }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "orderservice.fullname" . }}-secret-reader
  labels:
    {{- include "orderservice.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "orderservice.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "orderservice.fullname" . }}-secret-reader
{{- end }}

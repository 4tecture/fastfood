variables:
# - name: AzureSubscription
#   value: 'Microsoft Azure Sponsorship'
- name: azureContainerRegistryServiceConnection
  value: 4taksDemoAcr
- name: azureContainerRegistry
  value: '4taksdemoacr.azurecr.io'
- name: azureResourceGroup
  value: 'aksDemo'
- name: kubernetesCluster
  value: 'dev-aks-k8sdemo-westeurope'
- name: kubectlVersion
  # Keep the client on the PR cluster's Kubernetes 1.35 minor and consume the
  # newest upstream patch available to the build image.
  value: '1.35.7'
- name: helmVersion
  value: '4.2.3'
- name: netCoreAspNetVersion
  value: 10.0.11
- name: NetCoreSdkVersion
  value: 10.0.400
- name: nodeVersion
  value: '24.19.0'
- name: playwrightVersion
  value: '1.62.0'
- name: powershellVersion
  value: '7.6.4'

- name: dockerFilePath
  value: 'src/services/$(folderNameComponent)/$(folderNameService)/Dockerfile'
- name: helmChartSourcePath
  value: 'src/services/$(folderNameComponent)/$(folderNameService)/chart/$(serviceName)'
- name: componentPath
  value: 'src/services/$(folderNameComponent)'

variables:
- name: serviceName
  value: financeservice
- name: pipelineArtifactName
  value: $(serviceName)
- name: folderNameComponent
  value: 'finance'
- name: folderNameService
  value: 'FinanceService'
- name: dockerRepositoryName
  value: $(serviceName)
- name: dockerRepositoryNameDeploy
  value: $(serviceName)-dbdeployment
- name: versionTagPrefix
  value: 'finance'
- name: dockerFilePathDeploy
  value: 'src/services/$(folderNameComponent)/$(folderNameService).Db.Cli/Dockerfile'
- name: databaseName
  value: 'FastFoodFinance'
- name: connectionString
  # Finance injects an Azure SQL access token through its authentication
  # provider/interceptor. Keep authentication out of the connection string so
  # SqlClient is not asked to use two mutually exclusive mechanisms.
  value: 'Server=$(sqlServerName).database.windows.net,1433;Database=$(databaseName);Encrypt=True;TrustServerCertificate=False;'

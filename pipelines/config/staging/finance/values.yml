image:
  repository: __azureContainerRegistry__/financeservice
  dbdeployclirepository: __azureContainerRegistry__/financeservice-dbdeployment
  tag: __artifactVersion__
  digest: __imageDigest__
  dbDeployDigest: __dbDeployImageDigest__
database:
  connectionString: __connectionString__
  useInMemoryDatabase: false
  existingSecret: ""
  createSecret: false
migration:
  enabled: true
workloadIdentity:
  enabled: true
  provider: "Azure"
  azure:
    clientId: "__serviceWorkloadIdentityClientId__"
    name: "__serviceWorkloadIdentityName__"
deployWorkloadIdentity:
  enabled: true
  provider: "Azure"
  azure:
    clientId: "__deployWorkloadIdentityClientId__"
    name: "__deployWorkloadIdentityName__"

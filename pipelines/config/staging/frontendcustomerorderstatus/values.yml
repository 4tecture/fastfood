image:
  repository: __azureContainerRegistry__/frontendcustomerorderstatus
  tag: __artifactVersion__
  digest: __imageDigest__

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cluster
  hosts:
    - host: customerorderstatus.fastfood.staging.aksdemo.4tecture.ch
      paths:
        - path: /
          pathType: Prefix
  tls: 
  - secretName: frontendcustomerorderstatus-tls
    hosts:
      - customerorderstatus.fastfood.staging.aksdemo.4tecture.ch

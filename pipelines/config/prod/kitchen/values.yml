image:
  repository: __azureContainerRegistry__/kitchenservice
  tag: __artifactVersion__
  digest: __imageDigest__
replicaCount: 2
autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 10 }
podDisruptionBudget: { enabled: true, minAvailable: 1 }
networkPolicy:
  enabled: true
  ingressNamespaceSelector: { kubernetes.io/metadata.name: ingress-nginx }
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels: { app.kubernetes.io/name: kitchenservice }

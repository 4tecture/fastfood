parameters:
  - name: displayName
    type: string
    default: 'Run System Tests'
  - name: posUrl
    type: string
    default: ''
  - name: kitchenUrl
    type: string
    default: ''
  - name: orderStatusUrl
    type: string
    default: ''
  - name: publishVideos
    type: boolean
    default: true
  - name: headedMode
    type: boolean
    default: false
  - name: testFilter
    type: string
    default: ''
  - name: pipelineResourceAlias
    type: string
    default: 'CIBuild'
  - name: artifactName
    type: string
    default: 'systemtests'

steps:
  
  - task: DownloadPipelineArtifact@2
    displayName: 'Download System Tests'
    inputs:
      source: 'specific'
      project: '$(System.TeamProjectId)'
      pipeline: '$(resources.pipeline.${{ parameters.pipelineResourceAlias }}.pipelineID)'
      runVersion: 'specific'
      runId: '$(resources.pipeline.${{ parameters.pipelineResourceAlias }}.runID)'
      artifact: '${{ parameters.artifactName }}'
      path: '$(Pipeline.Workspace)/${{ parameters.pipelineResourceAlias }}/${{ parameters.artifactName }}'

  - bash: |
      set -euxo pipefail

      ROOT_DIR="$(Pipeline.Workspace)/${{ parameters.pipelineResourceAlias }}/${{ parameters.artifactName }}"
      echo "Root dir: $ROOT_DIR"

      echo "=== Listing downloaded tests ==="
      ls -R "$ROOT_DIR"

      echo "=== Making test hosts executable ==="
      # If your test host is a file like FastFood.Ui.System.Tests (no extension)
      find "$ROOT_DIR" -maxdepth 2 -type f -name '*.Ui.System.Tests' -exec chmod +x {} \;

      echo "=== Fixing Playwright executables ==="
      PW_DIR="$ROOT_DIR/.playwright"
      if [ -d "$PW_DIR" ]; then
        # Easiest and safest in CI: just mark everything under .playwright as executable
        find "$PW_DIR" -type f -exec chmod +x {} \;
        echo "Playwright contents after chmod:"
        ls -R "$PW_DIR"
      else
        echo "WARNING: $PW_DIR does not exist – browsers may not be in the artifact"
      fi

      echo "=== Preparing video directory ==="
      mkdir -p "$(Agent.TempDirectory)/Videos"
      chmod 700 "$(Agent.TempDirectory)/Videos"
    displayName: 'Create and set permissions for test execution'
    # Pipeline artifacts and Agent.TempDirectory are host-owned bind mounts.
    # Prepare their permissions in the owning host context before container use.
    target: host

  # Run the staged test module through Microsoft.Testing.Platform. Using the
  # downloaded artifact's global.json and the dedicated Playwright worker keeps
  # the SDK, browser revision, and native dependencies deterministic.
  - bash: |
      set -euo pipefail

      FASTFOOD_TEST_ROOT='$(Pipeline.Workspace)/${{ parameters.pipelineResourceAlias }}/${{ parameters.artifactName }}'
      FASTFOOD_RESULTS_DIRECTORY='$(Agent.TempDirectory)/SystemTestResults'
      mkdir -p "${FASTFOOD_RESULTS_DIRECTORY}"

      mapfile -t FASTFOOD_TEST_MODULES < <(find "${FASTFOOD_TEST_ROOT}" -type f -name '*.Ui.System.Tests.dll' ! -path '*/ref/*' -print)
      if [ "${#FASTFOOD_TEST_MODULES[@]}" -ne 1 ]; then
        echo "Expected exactly one UI system-test module, found ${#FASTFOOD_TEST_MODULES[@]}." >&2
        printf '%s\n' "${FASTFOOD_TEST_MODULES[@]}" >&2
        exit 1
      fi
      FASTFOOD_TEST_MODULE="${FASTFOOD_TEST_MODULES[0]#"${FASTFOOD_TEST_ROOT}/"}"

      FASTFOOD_TEST_ARGUMENTS=(
        test
        --test-modules "${FASTFOOD_TEST_MODULE}"
        --root-directory "${FASTFOOD_TEST_ROOT}"
        --minimum-expected-tests 1
        --results-directory "${FASTFOOD_RESULTS_DIRECTORY}"
        --report-trx
        --report-trx-filename=system_tests.trx
      )
      if [ -n "${FASTFOOD_TEST_FILTER}" ]; then
        FASTFOOD_TEST_ARGUMENTS+=("--filter-query=${FASTFOOD_TEST_FILTER}")
      fi

      dotnet "${FASTFOOD_TEST_ARGUMENTS[@]}"
    displayName: '${{ parameters.displayName }}'
    workingDirectory: '$(Pipeline.Workspace)/${{ parameters.pipelineResourceAlias }}/${{ parameters.artifactName }}'
    env:
      FASTFOOD_TEST_FILTER: '${{ parameters.testFilter }}'
      # Test configuration URLs
      TEST_POS_URL: 'https://${{ parameters.posUrl }}'
      TEST_KITCHEN_URL: 'https://${{ parameters.kitchenUrl }}'
      TEST_ORDERSTATUS_URL: 'https://${{ parameters.orderStatusUrl }}'
      # Playwright configuration
      HEADED: '${{ parameters.headedMode }}'
      # CI environment flag
      CI: 'true'
      # Video output directory
      VIDEO_OUTPUT_DIR: '$(Agent.TempDirectory)/Videos'
      PLAYWRIGHT_BROWSERS_PATH: '/ms-playwright'

  # Capture test outcome for downstream steps (e.g. PR status)
  - bash: echo "##vso[task.setvariable variable=SystemTestsState]succeeded"
    displayName: 'Record test outcome (passed)'
    condition: succeeded()

  - bash: echo "##vso[task.setvariable variable=SystemTestsState]failed"
    displayName: 'Record test outcome (failed)'
    condition: failed()

  # Publish test results explicitly; this keeps result handling visible and
  # deterministic instead of relying on DotNetCoreCLI's VSTest integration.
  - task: PublishTestResults@2
    displayName: 'Publish System Test Results'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'VSTest'
      testResultsFiles: '**/*.trx'
      searchFolder: '$(Agent.TempDirectory)/SystemTestResults'
      testRunTitle: '${{ parameters.displayName }}'
      mergeTestResults: true
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true

  # Publish video recordings
  - pwsh: |
      $videoPath = "$(Agent.TempDirectory)/Videos"
      if (Test-Path $videoPath) {
        $fileCount = (Get-ChildItem -Path $videoPath -Recurse -File | Measure-Object).Count
        Write-Host "Found $fileCount video file(s) in $videoPath"
        Write-Host "##vso[task.setvariable variable=HasVideos]true"
      } else {
        Write-Host "No videos directory found at $videoPath"
        Write-Host "##vso[task.setvariable variable=HasVideos]false"
      }
    displayName: 'Check for Video Files'
    condition: always()

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Video Recordings'
    inputs:
      PathtoPublish: '$(Agent.TempDirectory)/Videos'
      ArtifactName: 'SystemTestVideos'
      publishLocation: 'Container'
    condition: and(always(), eq('${{ parameters.publishVideos }}', 'true'), eq(variables['HasVideos'], 'true'))

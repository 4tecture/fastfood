# =====================================================================
# .trivy.yaml
# Trivy configuration enforcing a strict open-source license policy
# Example enterprise allow/deny classification. Have legal counsel adapt this
# list to the organization's distribution model and obligations.
# This file is used automatically when you set:
#   trivyConfigPath: '.trivy.yaml'
# in your Azure Pipelines job template.
# =====================================================================

# ------------------------------------------------------------------------------
# License classification
# ------------------------------------------------------------------------------
license:
  # Permissive licenses you explicitly ALLOW
  permissive:
    - MIT
    - Apache-2.0
    - BSD-2-Clause
    - BSD-3-Clause
    - ISC
    - Zlib
    - PostgreSQL
    - Python-2.0
    - Ruby
    - Unlicense

  # Everything here is NOT allowed (will be CRITICAL → pipeline fails)
  forbidden:
    - GPL-1.0
    - GPL-2.0
    - GPL-2.0-only
    - GPL-2.0-or-later
    - GPL-3.0
    - GPL-3.0-only
    - GPL-3.0-or-later
    - AGPL-1.0
    - AGPL-3.0
    - AGPL-3.0-only
    - AGPL-3.0-or-later
    - WTFPL
    - CC-BY-1.0
    - CC-BY-2.0
    - CC-BY-2.5
    - CC-BY-3.0
    - CC-BY-4.0
    - CC-BY-SA-1.0
    - CC-BY-SA-2.0
    - CC-BY-SA-2.5
    - CC-BY-SA-3.0
    - CC-BY-SA-4.0

  # Optional: anything unknown → forbidden too (strict mode)
  # uncomment to enable strict unknown handling
  # unknown: forbidden

# ------------------------------------------------------------------------------
# General Trivy options (safe defaults for CI)
# ------------------------------------------------------------------------------
# Cache directory (overridden by pipeline param)
cache-dir: .trivy-cache

# Only show relevant severity (Trivy maps forbidden → CRITICAL)
severity:
  - CRITICAL
  - HIGH
  - MEDIUM
  - LOW
  - UNKNOWN

# Exclude noisy directories (build outputs, VCS, etc.)
skip-dirs:
  - .git
  - .github
  - .azure-pipelines
  - bin
  - obj
  - node_modules
  - dist
  - out
  - deploy/helm

# Ignore files are intentionally not configured by default. Add a reviewed
# .trivyignore and set ignorefile only when a time-bounded exception is needed.

# Control the level of license detection strictness (0–1)
license-confidence-level: 0.9
